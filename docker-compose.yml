services:
  db:
    image: postgres:16
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
      
  odoo18:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8066:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons/base
      # - C:\Users\stcor\Documents\STCORP\PT Click:/mnt/extra-addons/pt_click
      # - C:\Users\stcor\Documents\STCORP\Freight Forwarding\Odoo\MODULE_FF_WPC\addons:/mnt/extra-addons/pt_wpc
    command: odoo --db_user=odoo --db_password=odoo --db_host=db

volumes:
  odoo-web-data:
  odoo-db-data: